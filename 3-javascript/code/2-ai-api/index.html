<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artficial Intelegence API</title>
    <!-- our css -->
    <link rel="stylesheet" href="./src/css/style.css" />
    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- root flex container -->
    <div
      class="w-full md:w-[768px] m-auto flex flex-col justify-between h-screen shadow-md"
    >
      <!-- header (fixed height) -->
      <header class="bg-[#0029A6] p-3 flex justify-between items-center">
        <div class="text-white text-2xl font-bold">Joee-AI</div>
        <a href="https://josserich.github.io" class="text-white"
          >created by josse surya pinem</a
        >
      </header>
      <!-- chat area -->
      <main class="p-4 overflow-y-auto bg-white flex-grow"></main>
      <!-- input (fixed bottom) -->
      <footer class="flex w-full gap-1 px-2 py-3 bg-white">
        <input
          type="text"
          class="bg-blue-100 p-3 w-[90%] rounded-md"
          placeholder="Ask Me Anything..."
        />
        <button
          class="px-4 bg-[#0029A6] text-white w-[10%] rounded flex justify-center items-center"
        >
          <i class="material-icons text-white">send</i>
        </button>
      </footer>
    </div>
    <!-- javascript -->
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
